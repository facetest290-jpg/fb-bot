# Put this file at:  .github/workflows/watch.yml   (on the default branch)
# Run it from:       GitHub -> Actions -> "Watch Facebook page" -> Run workflow
#
# No inputs: everything comes from TWO repo Secrets
# (Settings -> Secrets and variables -> Actions -> New repository secret):
#   ENV_FILE    = the full content of your .env file (including FB_PAGES)
#   COOKIES_TXT = the full content of your cookies.txt file
# They are written to .env and cookies.txt inside the runner only.

name: Watch Facebook page

on:
  workflow_dispatch:

concurrency:
  group: watch-facebook
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 350          # GitHub's hard limit is 360

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright + Chromium
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Write .env and cookies.txt from secrets
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          COOKIES_TXT: ${{ secrets.COOKIES_TXT }}
        run: |
          printf '%s\n' "$ENV_FILE" > .env
          printf '%s\n' "$COOKIES_TXT" > cookies.txt

      - name: Run watch mode
        env:
          STATE_DIR: ${{ runner.temp }}/state
        run: python fb_watcher.py --cron
